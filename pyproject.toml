[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-task-factory"
version = "0.1.0"
description = "Reusable procedural benchmark pipeline for 2D facility spatial layout and safety inspection visual reasoning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0,<13.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
